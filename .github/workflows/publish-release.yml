# Publishes a release from an APK that was already built and signed elsewhere.
#
# The signing key never comes to GitHub. Whoever builds the release pushes the signed APK to a
# branch named release-assets-<tag> (holding only Nomi-<tag>-release.apk, or that file split
# into Nomi-<tag>-release.apk.part-NN plus Nomi-<tag>-release.apk.sha256) and then pushes the
# tag - or, where tags cannot be pushed, starts this workflow by hand with the tag name, and the
# release creates the tag on the commit the workflow ran on. This job attaches that APK to a
# release titled from release-notes-<tag>.md and removes the asset branch again, so the APK does
# not stay in the repository.
name: Publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v2.9.0. Created on the selected branch's latest commit."
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the signed APK
        run: |
          git fetch --depth=1 origin "release-assets-${TAG}"
          APK="Nomi-${TAG}-release.apk"
          if git cat-file -e "FETCH_HEAD:${APK}" 2>/dev/null; then
            git show "FETCH_HEAD:${APK}" > "$APK"
          else
            # A slow or lossy uplink cannot push the whole APK in one piece, so the branch may
            # hold it as numbered parts instead, pushed one small commit at a time, next to
            # the checksum the joined file has to match.
            : > "$APK"
            for part in $(git ls-tree --name-only FETCH_HEAD | grep -F "${APK}.part-" | sort); do
              git show "FETCH_HEAD:${part}" >> "$APK"
            done
            git show "FETCH_HEAD:${APK}.sha256" | sha256sum --check --strict -
          fi
          ls -l "$APK"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="release-notes-${TAG}.md"
          # "Nomi v2.9.0 — <first section heading>", the way earlier releases were titled.
          HEADING="$(grep -m1 '^### ' "$NOTES" | sed 's/^### //')"
          TITLE="Nomi ${TAG}${HEADING:+ — $HEADING}"
          # A pushed tag already exists; a manual run creates it on the commit this run checked out.
          gh release create "$TAG" "Nomi-${TAG}-release.apk" \
            --title "$TITLE" \
            --notes-file "$NOTES" \
            --target "$GITHUB_SHA"

      - name: Remove the asset branch
        run: git push origin --delete "release-assets-${TAG}"
