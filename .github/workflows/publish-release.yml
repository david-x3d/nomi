# Publishes a release from an APK that was already built and signed elsewhere.
#
# The signing key never comes to GitHub. Whoever builds the release pushes the signed APK to a
# branch named release-assets-<tag> (holding only Nomi-<tag>-release.apk) and then pushes the
# tag. This job attaches that APK to a release titled from release-notes-<tag>.md and removes
# the asset branch again, so the APK does not stay in the repository.
name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the signed APK
        run: |
          TAG="${GITHUB_REF_NAME}"
          git fetch --depth=1 origin "release-assets-${TAG}"
          git show "FETCH_HEAD:Nomi-${TAG}-release.apk" > "Nomi-${TAG}-release.apk"
          ls -l "Nomi-${TAG}-release.apk"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="release-notes-${TAG}.md"
          # "Nomi v2.9.0 — <first section heading>", the way earlier releases were titled.
          HEADING="$(grep -m1 '^### ' "$NOTES" | sed 's/^### //')"
          TITLE="Nomi ${TAG}${HEADING:+ — $HEADING}"
          gh release create "$TAG" "Nomi-${TAG}-release.apk" \
            --title "$TITLE" \
            --notes-file "$NOTES" \
            --verify-tag

      - name: Remove the asset branch
        run: git push origin --delete "release-assets-${GITHUB_REF_NAME}"
