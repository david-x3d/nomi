# Publishes a release from APKs that were already built and signed elsewhere.
#
# The signing key never comes to GitHub. Whoever builds the release pushes the signed APKs to a
# branch named release-assets-<tag> - Nomi-<tag>-release.apk and, from v2.11.0 on, the Wear OS app
# as Nomi-<tag>-wear-release.apk, either of which may instead be split into <name>.part-NN plus
# <name>.sha256 - and then pushes the tag. Where tags cannot be pushed, they start this workflow
# by hand with the tag name instead, and the release creates the tag on the commit the workflow
# ran on. This job attaches the APKs to a release titled from release-notes-<tag>.md and removes
# the asset branch again, so the APKs do not stay in the repository.
name: Publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v2.9.0. Created on the selected branch's latest commit."
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Creating the release by hand (workflow_dispatch) also creates the tag, which starts this
      # workflow a second time through the tag push - after the asset branch is already gone. That
      # second run has nothing left to publish, so it stops here instead of failing.
      - name: Skip if the release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.existing.outputs.skip != 'true'

      - name: Fetch the signed APKs
        if: steps.existing.outputs.skip != 'true'
        run: |
          git fetch --depth=1 origin "release-assets-${TAG}"
          # Each APK is either one file or, when a slow or lossy uplink cannot push it in one
          # piece, numbered parts pushed one small commit at a time next to the checksum the
          # joined file has to match.
          fetch_apk() {
            APK="$1"
            if git cat-file -e "FETCH_HEAD:${APK}" 2>/dev/null; then
              git show "FETCH_HEAD:${APK}" > "$APK"
            else
              : > "$APK"
              for part in $(git ls-tree --name-only FETCH_HEAD | grep -F "${APK}.part-" | sort); do
                git show "FETCH_HEAD:${part}" >> "$APK"
              done
              git show "FETCH_HEAD:${APK}.sha256" | sha256sum --check --strict -
            fi
            ls -l "$APK"
          }
          fetch_apk "Nomi-${TAG}-release.apk"
          # The Wear OS app ships next to the phone app from v2.11.0 on; older tags have none.
          WEAR="Nomi-${TAG}-wear-release.apk"
          if git ls-tree --name-only FETCH_HEAD | grep -qF "$WEAR"; then
            fetch_apk "$WEAR"
          fi

      - name: Create the release
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="release-notes-${TAG}.md"
          # "Nomi v2.9.0 — <first section heading>", the way earlier releases were titled.
          HEADING="$(grep -m1 '^### ' "$NOTES" | sed 's/^### //')"
          TITLE="Nomi ${TAG}${HEADING:+ — $HEADING}"
          # A pushed tag already exists; a manual run creates it on the commit this run checked out.
          ASSETS=("Nomi-${TAG}-release.apk")
          if [ -f "Nomi-${TAG}-wear-release.apk" ]; then ASSETS+=("Nomi-${TAG}-wear-release.apk"); fi
          gh release create "$TAG" "${ASSETS[@]}" \
            --title "$TITLE" \
            --notes-file "$NOTES" \
            --target "$GITHUB_SHA"

      - name: Remove the asset branch
        if: steps.existing.outputs.skip != 'true'
        run: git push origin --delete "release-assets-${TAG}"
